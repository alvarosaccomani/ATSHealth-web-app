<div class="bg-white dark:bg-darkBg-800 rounded-3xl p-7 sm:p-9 border border-slate-200 dark:border-darkBg-700 shadow-xl shadow-slate-200/50 dark:shadow-none transition-colors">
  
  <!-- Encabezado de la tarjeta -->
  <div class="mb-7 text-center sm:text-left">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-teal-50 dark:bg-teal-950/70 border border-teal-200 dark:border-teal-800 text-teal-700 dark:text-teal-300 mb-3">
      <i class="fa-solid fa-lock"></i> Portal Clínico Seguro
    </div>
    <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
      Acceso Profesional
    </h2>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
      Ingresá con tus credenciales habilitadas para acceder a historias clínicas y planes de rehabilitación.
    </p>
  </div>

  <!-- Alerta de error -->
  @if (errorMessage()) {
    <div class="mb-5 p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs flex items-center gap-2.5 animate-fadeIn">
      <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <!-- Formulario -->
  <form (submit)="submitLogin($event)" class="space-y-4 text-xs">
    
    <!-- Campo Email / Matrícula -->
    <div>
      <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">
        Email o Matrícula Profesional
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-envelope"></i>
        </span>
        <input 
          type="email" 
          [value]="email()" 
          (input)="onEmailChange($event)"
          placeholder="profesional@pelvicloud.com" 
          required
          class="w-full pl-10 pr-3.5 py-3 rounded-xl border border-slate-200 dark:border-darkBg-700 bg-slate-50/70 dark:bg-darkBg-750 text-slate-900 dark:text-slate-100 placeholder-slate-400 text-xs font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
      </div>
    </div>

    <!-- Campo Contraseña -->
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="font-bold text-slate-700 dark:text-slate-300">
          Contraseña
        </label>
        <a href="javascript:void(0)" class="text-[11px] font-semibold text-brand-600 dark:text-brand-400 hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-lock"></i>
        </span>
        <input 
          [type]="showPassword() ? 'text' : 'password'" 
          [value]="password()" 
          (input)="onPasswordChange($event)"
          placeholder="Tu contraseña médica" 
          required
          class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 dark:border-darkBg-700 bg-slate-50/70 dark:bg-darkBg-750 text-slate-900 dark:text-slate-100 placeholder-slate-400 text-xs font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all">
        <button 
          type="button" 
          (click)="togglePasswordVisibility()" 
          class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer">
          <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
        </button>
      </div>
    </div>

    <!-- Recordarme -->
    <div class="flex items-center justify-between pt-1">
      <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-300 select-none">
        <input 
          type="checkbox" 
          [checked]="rememberMe()" 
          (change)="onRememberChange($event)"
          class="rounded text-brand-600 focus:ring-brand-500">
        <span>Mantener mi sesión activa en este equipo</span>
      </label>
    </div>

    <!-- Botón de Submit -->
    <div class="pt-2">
      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-gradient-to-r from-brand-600 via-teal-600 to-emerald-600 hover:from-brand-700 hover:to-teal-700 shadow-md shadow-brand-500/25 transition-all flex items-center justify-center gap-2 text-xs disabled:opacity-75 disabled:cursor-not-allowed cursor-pointer">
        @if (isLoading()) {
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span>Autenticando profesional...</span>
        } @else {
          <span>Ingresar al Sistema</span>
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        }
      </button>
    </div>

  </form>

  <!-- Separador -->
  <div class="relative my-6">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-slate-200 dark:border-darkBg-700"></div>
    </div>
    <div class="relative flex justify-center text-[10px] uppercase tracking-wider font-bold">
      <span class="bg-white dark:bg-darkBg-800 px-3 text-slate-400">o acceso para evaluación</span>
    </div>
  </div>

  <!-- Botón Demo rápido -->
  <button 
    type="button" 
    (click)="loginWithDemo()" 
    class="w-full py-3 px-4 rounded-xl font-bold text-slate-700 dark:text-slate-200 bg-slate-50 dark:bg-darkBg-750 hover:bg-slate-100 dark:hover:bg-darkBg-700 border border-slate-200 dark:border-darkBg-700 transition-all flex items-center justify-center gap-2 text-xs cursor-pointer shadow-xs">
    <i class="fa-solid fa-bolt text-amber-500"></i>
    <span>Acceso Rápido Demo (Lic. Kgo. Especialista)</span>
  </button>

</div>
