<div class="min-h-screen flex flex-col bg-slate-100 dark:bg-darkBg-900 text-slate-800 dark:text-slate-100 transition-colors">
  <app-nav-bar />
  <app-patient-sticky-bar (sexChange)="activeSex.set($event)" />
  <app-stage-bar [(currentStage)]="activeStage" />
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12 w-full flex-1">
    @if (activeStage() === 1) {
      <app-stage-1-anamnesis [sex]="activeSex()" (nextStage)="activeStage.set($event)" />
    }
    <router-outlet />
  </main>
</div>
