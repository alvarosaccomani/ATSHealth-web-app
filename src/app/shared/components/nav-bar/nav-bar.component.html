<header class="bg-white/95 dark:bg-darkBg-800/95 backdrop-blur-md border-b border-slate-200 dark:border-darkBg-700 shadow-xs transition-colors">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Logo y Marca -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-700 via-brand-600 to-teal-400 text-white flex items-center justify-center text-lg shadow-md shadow-brand-500/20">
        <i class="fa-solid fa-staff-snake"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-teal-700 via-brand-600 to-emerald-500 bg-clip-text text-transparent dark:from-teal-300 dark:to-emerald-400">
            PelviCloud
          </span>
          <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-teal-100 text-teal-800 dark:bg-teal-950 dark:text-teal-300 border border-teal-200 dark:border-teal-800">
            SaaS Uro-Pelviperineal v3
          </span>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Historia Clínica Especializada & Biomecánica Pélvica</p>
      </div>
    </div>

    <!-- Navegación Principal -->
    <nav class="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-darkBg-750 p-1 rounded-xl border border-slate-200 dark:border-darkBg-700 text-xs font-semibold">
      <a
        routerLink="/admin/application/patients"
        routerLinkActive="bg-white dark:bg-darkBg-700 text-brand-700 dark:text-brand-300 shadow-xs"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all cursor-pointer">
        <i class="fa-solid fa-users text-[11px]"></i>
        <span>Pacientes</span>
      </a>
      <a
        routerLink="/admin/application/encounter"
        routerLinkActive="bg-white dark:bg-darkBg-700 text-brand-700 dark:text-brand-300 shadow-xs"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all cursor-pointer">
        <i class="fa-solid fa-notes-medical text-[11px]"></i>
        <span>Consulta Activa</span>
      </a>
    </nav>

    <!-- Acciones de barra superior -->
    <div class="flex items-center gap-2.5">
      
      <!-- Estado de Autoguardado -->
      <div class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-50 dark:bg-darkBg-750 text-slate-500 dark:text-slate-400 border border-slate-200/80 dark:border-darkBg-700">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>{{ autosaveStatus() }}</span>
      </div>

      <!-- Toggle Día / Noche -->
      <button 
        type="button" 
        (click)="toggleTheme()" 
        aria-label="Cambiar tema día/noche"
        class="relative p-2 rounded-xl bg-slate-100 dark:bg-darkBg-750 text-slate-600 dark:text-amber-300 hover:bg-slate-200 dark:hover:bg-darkBg-700 border border-slate-200 dark:border-darkBg-700 transition-all flex items-center justify-center w-10 h-10 shadow-xs cursor-pointer">
        @if (isDarkMode()) {
          <i class="fa-solid fa-sun text-base text-amber-400" title="Activar modo diurno"></i>
        } @else {
          <i class="fa-solid fa-moon text-base text-slate-700" title="Activar modo nocturno"></i>
        }
      </button>

      <!-- Botón Imprimir -->
      <button 
        type="button" 
        (click)="printRecord()" 
        class="no-print hidden sm:flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 dark:bg-darkBg-750 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-darkBg-700 border border-slate-200 dark:border-darkBg-700 transition-all cursor-pointer">
        <i class="fa-solid fa-print"></i>
        <span>Imprimir</span>
      </button>

      <!-- Botón Guardar Consulta -->
      <button 
        type="button" 
        (click)="saveRecord()" 
        class="flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-xl bg-gradient-to-r from-brand-600 to-teal-600 hover:from-brand-700 hover:to-teal-700 text-white shadow-sm shadow-brand-500/25 transition-all cursor-pointer">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Guardar Consulta</span>
      </button>

    </div>
  </div>
</header>
