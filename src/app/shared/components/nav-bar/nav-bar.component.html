<header class="bg-white/95 dark:bg-darkBg-800/95 backdrop-blur-md border-b border-slate-200 dark:border-darkBg-700 shadow-xs transition-colors">
  <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    
    <!-- Botón Toggle Sidebar (Mobile + Desktop) y Migas de Pan / Contexto -->
    <div class="flex items-center gap-3">
      <!-- Botón Hamburguesa Mobile -->
      <button
        type="button"
        (click)="sidebarService.toggleMobile()"
        aria-label="Abrir menú de navegación"
        class="md:hidden p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-darkBg-700 transition-colors cursor-pointer">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>

      <!-- Botón Colapsar Desktop -->
      <button
        type="button"
        (click)="sidebarService.toggleCollapse()"
        aria-label="Colapsar o expandir barra lateral"
        class="hidden md:flex p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-darkBg-700 transition-colors cursor-pointer">
        <i class="fa-solid fa-bars-staggered text-base"></i>
      </button>

      <!-- Separador Vertical -->
      <div class="hidden sm:block h-5 w-px bg-slate-200 dark:bg-darkBg-700"></div>

      <!-- Contexto Clínico Activo -->
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">
          Módulo Clínico:
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border border-teal-200/80 dark:border-teal-800">
          <i class="fa-solid fa-notes-medical text-[10px]"></i> PelviCloud EHR
        </span>
      </div>
    </div>

    <!-- Acciones de barra superior (Tema & Perfil) -->
    <div class="flex items-center gap-3">
      
      <!-- Toggle Día / Noche -->
      <button 
        type="button" 
        (click)="toggleTheme()" 
        aria-label="Cambiar tema día/noche"
        class="relative p-2 rounded-xl bg-slate-100 dark:bg-darkBg-750 text-slate-600 dark:text-amber-300 hover:bg-slate-200 dark:hover:bg-darkBg-700 border border-slate-200 dark:border-darkBg-700 transition-all flex items-center justify-center w-10 h-10 shadow-xs cursor-pointer">
        @if (isDarkMode()) {
          <i class="fa-solid fa-sun text-base text-amber-400" title="Activar modo diurno"></i>
        } @else {
          <i class="fa-solid fa-moon text-base text-slate-700" title="Activar modo nocturno"></i>
        }
      </button>

      <!-- Avatar Profesional / Perfil -->
      <div class="flex items-center gap-2.5 pl-2 border-l border-slate-200 dark:border-darkBg-700">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-600 to-brand-600 text-white flex items-center justify-center text-xs font-bold shadow-2xs">
          <span>DR</span>
        </div>
        <div class="hidden md:block text-left">
          <p class="text-xs font-bold text-slate-800 dark:text-slate-200 leading-tight">Dra. Especialista</p>
          <p class="text-[10px] text-slate-400 leading-tight">Uroginecología</p>
        </div>
      </div>

    </div>
  </div>
</header>
