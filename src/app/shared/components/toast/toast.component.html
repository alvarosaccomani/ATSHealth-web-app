<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="px-4 py-3 rounded-xl text-xs font-semibold text-white shadow-2xl flex items-center justify-between gap-3 pointer-events-auto transition-all"
      [class.toast-enter]="!toast.isClosing"
      [class.toast-leave]="toast.isClosing"
      [class.bg-slate-900]="toast.type === 'success' || toast.type === 'info'"
      [class.dark:bg-darkBg-750]="toast.type === 'success' || toast.type === 'info'"
      [class.border]="toast.type === 'success' || toast.type === 'info'"
      [class.border-slate-800]="toast.type === 'success' || toast.type === 'info'"
      [class.dark:border-darkBg-700]="toast.type === 'success' || toast.type === 'info'"
      [class.bg-amber-600]="toast.type === 'warning'"
      [class.bg-rose-600]="toast.type === 'error'">
      
      <div class="flex items-center gap-2.5">
        @if (toast.type === 'success') {
          <i class="fa-solid fa-circle-check text-brand-400 text-sm"></i>
        } @else if (toast.type === 'warning') {
          <i class="fa-solid fa-triangle-exclamation text-amber-200 text-sm"></i>
        } @else if (toast.type === 'error') {
          <i class="fa-solid fa-circle-xmark text-rose-200 text-sm"></i>
        } @else {
          <i class="fa-solid fa-circle-info text-blue-300 text-sm"></i>
        }
        <span>{{ toast.message }}</span>
      </div>

      <button 
        type="button" 
        (click)="toastService.dismiss(toast.id)" 
        aria-label="Cerrar notificación"
        class="text-white/60 hover:text-white transition-colors p-1 cursor-pointer">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>

    </div>
  }
</div>
