<app-patient-sticky-bar
  #stickyBar
  (sexChange)="activeSex.set($event)"
  (onSave)="saveConsultation()"
  (onSign)="signConsultation()"
  (sessionSelect)="loadEncounter($event)"
/>
<app-stage-bar [(currentStage)]="activeStage" />
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12 w-full flex-1">
  <div [class.hidden]="activeStage() !== 1">
    <app-stage-1-anamnesis
      #stage1
      [sex]="activeSex()"
      (nextStage)="activeStage.set($event)"
    />
  </div>
  <div [class.hidden]="activeStage() !== 2">
    <app-stage-2-physical-exam
      #stage2
      (prevStage)="activeStage.set($event)"
      (nextStage)="activeStage.set($event)"
    />
  </div>
  <div [class.hidden]="activeStage() !== 3">
    <app-stage-3-treatment-plan
      #stage3
      (prevStage)="activeStage.set($event)"
      (nextStage)="activeStage.set($event)"
    />
  </div>
  <div [class.hidden]="activeStage() !== 4">
    <app-stage-4-evolution
      #stage4
      (prevStage)="activeStage.set($event)"
      (completeConsultation)="saveConsultation(true)"
    />
  </div>
</main>
